<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b3a91">
<title>النسخة الجديدة من تطبيق المشرف</title>
<link rel="icon" href="icon-512.png">
<style>
:root{color-scheme:light;--purple:#5b3a91;--pink:#f34f96;--orange:#ffad28;--blue:#2f7bc5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:#30235d;background:
radial-gradient(circle at 12% 12%,rgba(255,173,40,.28),transparent 28%),
radial-gradient(circle at 88% 18%,rgba(243,79,150,.22),transparent 30%),
linear-gradient(145deg,#fffaf2 0%,#f8f1ff 58%,#eef7ff 100%);display:grid;place-items:center;padding:24px}
.card{width:min(100%,470px);background:rgba(255,255,255,.94);border:1px solid rgba(91,58,145,.11);border-radius:30px;padding:34px 24px;text-align:center;box-shadow:0 24px 70px rgba(66,43,115,.16)}
.logo{width:132px;height:132px;object-fit:contain;margin:0 auto 16px;filter:drop-shadow(0 12px 20px rgba(67,45,125,.16))}
.badge{display:inline-block;padding:7px 13px;border-radius:999px;background:#fff0f6;color:#b52669;font-weight:700;font-size:14px}
h1{font-size:27px;line-height:1.45;margin:16px 0 10px}
p{font-size:17px;line-height:1.9;color:#696178;margin:0 auto 24px}
a{display:block;text-decoration:none;color:white;font-weight:800;font-size:18px;padding:16px 20px;border-radius:18px;background:linear-gradient(105deg,var(--blue),var(--purple) 56%,var(--pink));box-shadow:0 13px 28px rgba(91,58,145,.26)}
small{display:block;margin-top:16px;color:#8b8497;line-height:1.7}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="icon-512.png" alt="هواية">
<div class="badge">تم الانتقال للنسخة الجديدة</div>
<h1>هذه النسخة القديمة لم تعد متاحة للاستخدام</h1>
<p>لن تتمكن من تنفيذ أي إجراء هنا. استخدم النسخة الجديدة من تطبيق المشرف من الزر التالي.</p>
<a href="https://alrakah-org.github.io/hewaya-supabase/apps/supervisor/">فتح النسخة الجديدة</a>
<small>يمكنك حفظ الرابط الجديد أو تثبيته على جهازك للوصول إليه مباشرة.</small>
</main>
</body>
</html>
