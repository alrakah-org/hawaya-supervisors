<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقات عضوية طلاب هواية</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--purple:#68459A;--pink:#F6529A;--orange:#FFA826;--text:#33254B;--muted:#8D829D;}
  *{box-sizing:border-box;}
  body{font-family:'Almarai',Tahoma,sans-serif;margin:0;padding:24px;direction:rtl;color:var(--text);background:#F6F4FB;}
  .hidden{display:none!important;}
  #gateView{min-height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center;}
  .gate-card{background:#fff;border-radius:22px;padding:30px 26px;max-width:380px;width:100%;box-shadow:0 18px 50px -12px rgba(53,40,104,.22);}
  .gate-card h1{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:1.35rem;color:var(--purple);text-align:center;margin:0 0 18px;}
  .gate-card label{display:block;font-size:.88rem;font-weight:700;color:var(--purple);margin-bottom:16px;}
  .gate-card select,.gate-card input{width:100%;margin-top:8px;padding:13px 14px;border-radius:14px;border:2px solid #E7E2F2;background:#FBFAFD;font-family:'Almarai',sans-serif;font-size:1rem;}
  button{border:0;cursor:pointer;font-family:'Almarai',sans-serif;font-weight:800;}
  .gate-card button,.print-btn{width:100%;padding:14px;border-radius:999px;background:linear-gradient(95deg,var(--purple),var(--pink));color:#fff;font-size:1rem;}
  .gate-error{color:#D1485B;font-size:.85rem;text-align:center;min-height:1.2em;margin-top:12px;font-weight:700;}
  .top-actions{max-width:18.6cm;margin:0 auto 20px;display:flex;align-items:center;gap:12px;}
  .print-btn{max-width:260px;margin:auto;}
  .print-note{font-size:.78rem;color:var(--muted);text-align:center;margin:0 0 14px;}
  .cards-grid{display:grid;grid-template-columns:repeat(2,9cm);grid-auto-rows:5cm;gap:.35cm .55cm;width:18.55cm;margin:0 auto;align-items:start;}
  .membership-card{
    width:9cm;height:5cm;position:relative;border-radius:18px;overflow:hidden;
    background:linear-gradient(145deg,#FFF8EE 0%,#FFF0F7 46%,#EEE8FA 100%);
    border:1.5px solid rgba(104,69,154,.20);padding:.35cm .42cm .3cm;
    break-inside:avoid;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .membership-card::before,.membership-card::after{content:'';position:absolute;border-radius:50%;pointer-events:none;}
  .membership-card::before{width:3.5cm;height:3.5cm;background:rgba(246,82,154,.10);top:-2cm;right:-1.2cm;}
  .membership-card::after{width:3cm;height:3cm;background:rgba(255,168,38,.14);bottom:-1.8cm;left:-1cm;}
  .card-header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:.3cm;padding-bottom:.18cm;margin-bottom:.15cm;border-bottom:1px solid rgba(104,69,154,.16);}
  .membership-title{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:.8rem;font-weight:800;color:var(--purple);line-height:1.05;}
  .membership-title small{display:block;font-family:'Almarai',sans-serif;font-size:.43rem;color:var(--pink);margin-top:2px;}
  .logo{height:.72cm;max-width:2.25cm;width:auto;object-fit:contain;}
  .student-name{position:relative;z-index:1;font-size:.72rem;font-weight:800;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.1cm;}
  .details{position:relative;z-index:1;}
  .detail-row{display:flex;align-items:center;justify-content:space-between;gap:.25cm;padding:.085cm 0;border-top:1px solid rgba(104,69,154,.10);}
  .detail-label{font-size:.43rem;font-weight:700;color:var(--muted);}
  .detail-value{font-size:.52rem;font-weight:800;color:var(--text);direction:ltr;text-align:left;}
  .detail-value.stage{direction:rtl;text-align:left;}
  .card-footer{position:absolute;z-index:1;right:.42cm;left:.42cm;bottom:.23cm;height:.09cm;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange));}
  .empty,.loading{text-align:center;color:var(--muted);grid-column:1/-1;padding:30px;}
  @media print{
    @page{size:A4 portrait;margin:9mm 7.5mm;}
    body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .top-actions,.print-note{display:none!important;}
    .cards-grid{margin:0 auto;}
  }
  @media screen and (max-width:800px){body{padding:14px;}#reportView{overflow-x:auto;}}
</style>
</head>
<body>
<div id="gateView">
  <div class="gate-card">
    <h1>بطاقات عضوية الطلاب</h1>
    <form id="gateForm">
      <label>اسمك
        <select id="gateNameSelect" required>
          <option value="" disabled selected>اختر اسمك</option>
          <option>فارس مقبول</option><option>ناصر الصياح</option><option>عبدالرحمن بامشموس</option>
          <option>بشارة الزبير</option><option>عبدالعزيز الجامع</option><option>فهد الخضير</option>
          <option>أسامة نور</option><option>هادي باشا</option>
        </select>
      </label>
      <label>الرقم السري<input type="password" id="gatePinInput" inputmode="numeric" maxlength="4" placeholder="٤ أرقام" required></label>
      <button type="submit" id="gateSubmitBtn">عرض البطاقات</button>
      <p class="gate-error" id="gateError"></p>
    </form>
  </div>
</div>
<div id="reportView" class="hidden">
  <div class="top-actions"><button class="print-btn" onclick="window.print()">طباعة بطاقات A4 / حفظ PDF</button></div>
  <p class="print-note">اختر حجم الورق A4 والمقياس 100% مع تفعيل طباعة رسومات الخلفية.</p>
  <div class="cards-grid" id="cardsContainer"><p class="loading">جاري تحميل البطاقات...</p></div>
</div>
<script>
  const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbzVV1SDLMhie0fMAf2qfu-1wB5AmSvRl3u-T7JDm2wUzaut6I8Lo3NTMpd9P9wE706blA/exec';
  const LOGO_SRC='https://alrakah-org.github.io/hawaya-student/rowad-hawaya-logo.png';
  const SUPERVISOR_NAMES=['فارس مقبول','ناصر الصياح','عبدالرحمن بامشموس','بشارة الزبير','عبدالعزيز الجامع','فهد الخضير','أسامة نور','هادي باشا'];
  const SUPERVISOR_SESSION_KEY='hawaya_supervisor_session';
  async function callAppsScript(payload){
    const res=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }
  function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));}
  function showReport(){document.getElementById('gateView').classList.add('hidden');document.getElementById('reportView').classList.remove('hidden');loadCards();}
  document.getElementById('gateForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const name=document.getElementById('gateNameSelect').value;
    const pin=document.getElementById('gatePinInput').value.trim();
    const error=document.getElementById('gateError');
    const button=document.getElementById('gateSubmitBtn');
    error.textContent='';
    if(!name||!pin){error.textContent='اختر اسمك وأدخل رقمك السري';return;}
    button.disabled=true;button.textContent='جاري التحقق...';
    try{
      const result=await callAppsScript({action:'supervisorLogin',name,pin});
      if(!result.success){error.textContent=result.error||'الرقم السري غير صحيح';return;}
      localStorage.setItem(SUPERVISOR_SESSION_KEY,name);showReport();
    }catch(_){error.textContent='تعذر الاتصال، حاول مرة أخرى';}
    finally{button.disabled=false;button.textContent='عرض البطاقات';}
  });
  (function init(){const saved=localStorage.getItem(SUPERVISOR_SESSION_KEY);if(saved&&SUPERVISOR_NAMES.includes(saved))showReport();})();
  async function loadCards(){
    const container=document.getElementById('cardsContainer');
    try{
      const data=await callAppsScript({action:'getAllStudentsForBarcodeReport'});
      if(!data.success||!data.students?.length){container.innerHTML='<p class="empty">لا يوجد طلاب مسجلون بعد</p>';return;}
      container.innerHTML=data.students.map((student)=>`
        <article class="membership-card">
          <div class="card-header"><div class="membership-title">بطاقة عضوية<small>رواد هواية</small></div><img class="logo" src="${LOGO_SRC}" alt="رواد هواية"></div>
          <div class="student-name">${escapeHtml(student.name)}</div>
          <div class="details">
            <div class="detail-row"><span class="detail-label">المرحلة الدراسية</span><span class="detail-value stage">${escapeHtml(student.stage)}</span></div>
            <div class="detail-row"><span class="detail-label">اسم المستخدم</span><span class="detail-value">${escapeHtml(student.id)}</span></div>
            <div class="detail-row"><span class="detail-label">كلمة المرور</span><span class="detail-value">${escapeHtml(student.password)}</span></div>
          </div>
          <div class="card-footer"></div>
        </article>
      `).join('');
    }catch(_){container.innerHTML='<p class="empty" style="color:#D1485B">تعذر تحميل البطاقات، تحقق من الاتصال</p>';}
  }
</script>
</body>
</html>
